<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0"><title>StackLab Court Booking</title>

<style>

@media (max-width: 860px) {
  .owner.has-panel { grid-template-columns: minmax(0, 1fr) }

    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) }
}
.calbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.calbar .date { font-family: var(--display); font-size: 24px; font-weight: 700; min-width: 0 }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--muted) }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px }
.calhead, .cal { display: grid; grid-template-columns: 52px repeat(4, minmax(0, 1fr)) }

.cal .selbox { border: 2px dashed var(--sel); background: color-mix(in srgb, var(--sel) 18%, transparent); border-radius: 5px; z-index: 3; pointer-events: none; margin: 1px }

.restog { display: flex; gap: 6px; flex-wrap: wrap }
.restog button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; font-weight: 700; font-size: 13px }

.done h2 { color: var(--ok) }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, .times button { transition: background .12s, border-color .12s } }

<div id="app"></div>

<script>
/* ===================== helpers ===================== */
const RES = [
  { id: 'C1N', name: 'Court 1 North', court: 1, side: 'North' },
  { id: 'C1S', name: 'Court 1 South', court: 1, side: 'South' },
  { id: 'C2N', name: 'Court 2 North', court: 2, side: 'North' },
  { id: 'C2S', name: 'Court 2 South', court: 2, side: 'South' },
];
const ALL = RES.map(r => r.id);
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const G0 = 300, G1 = 1440, NR = (G1 - G0) / 30;           // owner grid: 5:00 AM to midnight
const pad = n => String(n).padStart(2, '0');
const p4 = n => String(n).padStart(4, '0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const TODAY = () => ds(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
const addMonths = (s, n) => { const d = parse(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return ds(d); };
const dow = s => parse(s).getDay();
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtT = m => { if (m >= 1440) return 'Midnight'; const h = Math.floor(m / 60), mm = m % 60; return `${h % 12 || 12}:${pad(mm)} ${h < 12 ? 'AM' : 'PM'}`; };
const fmtTs = m => fmtT(m).replace(':00', '');
const fmtD = (s, o = { weekday: 'short', month: 'short', day: 'numeric' }) => parse(s).toLocaleDateString('en-US', o);
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return [h ? h + ' hr' : '', r ? r + ' min' : ''].filter(Boolean).join(' '); };
const r2 = n => Math.round(n * 100) / 100;
const money = n => { n = r2(n); const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); return (n < 0 ? '−$' : '$') + s; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 7);
const resIdx = id => ALL.indexOf(id);
const sortRes = a => [...a].sort((x, y) => resIdx(x) - resIdx(y));
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e || '');
function resLabel(ids) {
  const s = new Set(ids); if (s.size === 4) return 'Entire gym';
  const parts = [];
  for (const c of [1, 2]) { const n = s.has(`C${c}N`), so = s.has(`C${c}S`);
    if (n && so) parts.push(`Court ${c} (full)`); else if (n) parts.push(`Court ${c} North half`); else if (so) parts.push(`Court ${c} South half`); }
  return parts.join(' + ');
}
function thanksgiving(y) { const first = new Date(y, 10, 1).getDay(); return ds(new Date(y, 10, 1 + ((4 - first + 7) % 7) + 21)); }
const nextDow = (from, d) => { let x = from; while (dow(x) !== d) x = addDays(x, 1); return x; };
const atISO = (date, m = 720) => `${date}T${pad(Math.floor(m / 60))}:${pad(m % 60)}:00`;
const nowISO = () => { const d = new Date(); return atISO(ds(d), d.getHours() * 60 + d.getMinutes()); };

/* ===================== state ===================== */
const KEY = 'stacklab-demo-v1';
let S;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) { const v = JSON.parse(raw); if (v && v.v === 1) { S = v; return; } } } catch (e) {}
  seed();
}

/* ===================== pricing ===================== */
function ruleFor(date, m) {
  const d = dow(date); let best = null, bs = -1, bi = -1;
  S.rules.forEach((r, i) => {
    const spec = !!(r.from || r.to);
    if (spec && ((r.from && date < r.from) || (r.to && date > (r.to || r.from)))) return;
    if (!r.days.includes(d) || m < r.start || m >= r.end) return;
    const s = spec ? 1 : 0;
    if (s > bs || (s === bs && i > bi)) { best = r; bs = s; bi = i; }
  });
  return best;
}
function units(resources) {
  const s = new Set(resources); if (s.size === 4) return [{ type: 'gym', label: 'Entire gym' }];
  const u = [];
  for (const c of [1, 2]) { const n = s.has(`C${c}N`), so = s.has(`C${c}S`);
    if (n && so) u.push({ type: 'full', label: `Court ${c} full` });
    else if (n || so) { const id = `C${c}${n ? 'N' : 'S'}`; u.push({ type: 'half', res: id, label: RES[resIdx(id)].name + ' half' }); } }
  return u;
}
function quote(date, resources, start, end) {
  const lines = {}; let total = 0, missing = 0;
  for (let m = start; m < end; m += 30) {
    const r = ruleFor(date, m); if (!r) { missing++; continue; }
    for (const u of units(resources)) {
      const rate = Number(r[u.type]) + (u.type === 'half' ? Number(S.adj[u.res] || 0) : 0);
      const k = `${r.id}|${u.label}|${rate}`;
      lines[k] = lines[k] || { label: u.label, rule: r.name, rate, hours: 0, amount: 0 };
      lines[k].hours += 0.5; lines[k].amount += rate / 2; total += rate / 2;
    }
  }
  const ls = Object.values(lines).map(l => ({ ...l, amount: r2(l.amount) }));
  return { total: r2(total), lines: ls, missing };
}
function linesHTML(lines, total, extra = '') {
  return `<div class="lines">${lines.map(l => `<div><span>${esc(l.label)} · ${esc(l.rule)}<br><span class="muted small">${l.hours} hr × ${money(l.rate)}/hr</span></span><span class="num">${money(l.amount)}</span></div>`).join('')}
    ${extra}<div class="tot"><span>Total</span><span class="num">${money(total)}</span></div></div>`;
}

/* ===================== schedule ===================== */
const hoursOf = date => S.hours[dow(date)];
function sessionsOf(c) {
  const out = [];
  for (let i = 0; i < c.weeks * 7; i++) { const d = addDays(c.startDate, i); if (c.days.includes(dow(d)) && !(c.skip || []).includes(d)) out.push(d); }
  return out;
}
function blockOn(b, date) {
  if (b.date) return b.date === date;
  const r = b.repeat;
  return r.days.includes(dow(date)) && date >= r.from && (!r.until || date <= r.until) && !(b.except || []).includes(date);
}
function itemsOn(date) {
  const it = [];
  for (const r of S.reservations) if (r.status === 'confirmed' && r.date === date) it.push({ kind: 'res', id: r.id, resources: r.resources, start: r.start, end: r.end, label: r.customer.name, ref: r });
  for (const c of S.classes) if (c.status !== 'cancelled' && sessionsOf(c).includes(date)) it.push({ kind: 'class', id: c.id, resources: c.resources, start: c.start, end: c.end, label: c.name, ref: c });

}

  return itemsOn(date).find(i => !(o.ignore && i.kind === o.ignore.kind && i.id === o.ignore.id) && !(o.ignoreBlocks && i.kind === 'block')

function charge(type, desc, amount, method, ref) {
  const t = { id: uid('t'), at: nowISO(), type, desc, amount: r2(amount), method, ref };
  S.txns.push(t); return t;
}
const refundedOf = t => r2(S.txns.filter(x => x.refundOf === t.id).reduce((a, x) => a - x.amount, 0));
function refundTxn(t, amt, why) {
  amt = r2(Math.min(amt, t.amount - refundedOf(t))); if (amt <= 0) return 0;
  S.txns.push({ id: uid('t'), at: nowISO(), type: 'refund', desc: `Refund: ${t.desc}${why ? ' (' + why + ')' : ''}`, amount: -amt, method: t.method, ref: t.ref, refundOf: t.id });
  if (t.ref && t.ref.kind === 'res') { const r = S.reservations.find(x => x.id === t.ref.id); if (r) r.paid = r2(r.paid - amt); }
  if (t.ref && t.ref.kind === 'reg') { const g = S.regs.find(x => x.id === t.ref.id); if (g) g.paid = r2((g.paid || 0) - amt); }
  return amt;
}
function refundRef(kind, id, amt, why) {
  let left = amt;
  for (const t of S.txns.filter(x => x.amount > 0 && x.ref && x.ref.kind === kind && x.ref.id === id)) { if (left <= 0) break; left = r2(left - refundTxn(t, left, why)); }
  return r2(amt - left);
}
function notify(to, subject, body) { S.outbox.unshift({ id: uid('m'), at: nowISO(), to, subject, body }); }

function createReservation(o) {

  S.reservations.push(r);

  return r;
}

/* ===================== calendar pointer handling ===================== */
let drag = null, lastPtr = '';
document.addEventListener('pointerdown', e => { lastPtr = e.pointerType; }, true);
window.addEventListener('pointerup', () => { if (drag) { drag = null; render(); } });
function setSel(ar, ac, r, c) {
  const r0 = Math.min(ar, r), r1 = Math.max(ar, r), c0 = Math.min(ac, c), c1 = Math.max(ac, c);
  UI.oc.sel = { ar, ac };
  const prev = UI.panel && UI.panel.type === 'sel' ? UI.panel.draft : null;
  UI.panel = { type: 'sel', draft: { date: UI.oc.date, resources: ALL.slice(c0, c1 + 1), start: G0 + r0 * 30, end: G0 + (r1 + 1) * 30,
    reason: prev ? prev.reason : '', repeat: prev ? prev.repeat : false, days: [dow(UI.oc.date)], until: prev ? prev.until : '', err: '' } };
}
function bindCal() {
  const cal = document.getElementById('cal'); if (!cal) return;
  cal.addEventListener('pointerdown', e => {
    const cell = e.target.closest('.cell'); if (!cell || e.pointerType !== 'mouse' || e.button !== 0) return;
    e.preventDefault(); drag = { r: +cell.dataset.r, c: +cell.dataset.c }; UI.oc.extending = false; setSel(drag.r, drag.c, drag.r, drag.c);
    document.getElementById('selwrap').innerHTML = selBoxes(UI.panel.draft);
  });
  cal.addEventListener('pointerover', e => {
    if (!drag) return; const cell = e.target.closest('.cell'); if (!cell) return;
    setSel(drag.r, drag.c, +cell.dataset.r, +cell.dataset.c); document.getElementById('selwrap').innerHTML = selBoxes(UI.panel.draft);
  });
  cal.addEventListener('click', e => {
    const cell = e.target.closest('.cell'); if (!cell) return;
    if (lastPtr === 'mouse' && e.detail > 0) return;           // mouse uses drag
    const r = +cell.dataset.r, c = +cell.dataset.c, s = UI.oc.sel;
    if (s && UI.oc.extending && UI.panel && UI.panel.type === 'sel') { setSel(s.ar, s.ac, r, c); UI.oc.extending = false; }
    else { setSel(r, c, r, c); UI.oc.extending = true; }
    render();
  });
}

      const skipped = blockDates({ ...d, days }).filter(x => conflict(x, d.resources, d.start, d.end, { ignoreBlocks: true }));
      S.blocks.push({ id: uid('b'), resources: sortRes(d.resources), start: d.start, end: d.end, reason: d.reason.trim(), repeat: { days, from: d.date, until: d.until || '' }, except: skipped });
      UI.flash = `Blocked every ${days.map(x => DAYS[x]).join(', ')} ${fmtT(d.start)}–${fmtT(d.end)}${skipped.length ? `. Skipped ${skipped.length} date(s) that already have bookings: ${skipped.slice(0, 4).map(x => fmtD(x)).join(', ')}${skipped.length > 4 ? '…' : ''}` : ''}.`;
    }
    UI.panel = null; UI.oc.sel = null; save();
  },
  unblockOne(a) { const b = find('blocks', a.dataset.id); b.except = [...(b.except || []), UI.panel.date]; UI.flash = `Unblocked ${fmtD(UI.panel.date)}. The rest of the series stays.`; UI.panel = null; save(); },
  unblockAll(a) { S.blocks = S.blocks.filter(b => b.id !== a.dataset.id); UI.flash = 'Unblocked.'; UI.panel = null; UI.confirm = null; save(); },
  selToRes() { const d = UI.panel.draft; UI.panel = { type: 'res', id: null, draft: emptyRes({ date: d.date, resources: [...d.resources], start: d.start, end: d.end }) }; },
  newRes() { UI.otab = 'calendar'; UI.panel = { type: 'res', id: null, draft: emptyRes() }; },
  editRes(a) { const r = find('reservations', a.dataset.id); UI.panel = { type: 'res', id: r.id, draft: emptyRes({ ...r.customer, date: r.date, resources: [...r.resources], start: r.start, end: r.end, note: r.note }) }; },
  showRes(a) { const r = find('reservations', a.dataset.id); UI.otab = 'calendar'; UI.oc.date = r.date; openItem('res', r.id, r.date); window.scrollTo(0, 0); },
  saveRes() {
    const p = UI.panel, d = p.draft; d.err = '';
    if (!d.name.trim()) return void (d.err = 'Enter the customer name.');
    if (d.email && !validEmail(d.email)) return void (d.err = 'That email does not look right.');
    if (!d.resources.length) return void (d.err = 'Pick at least one half court.');
    if (d.end <= d.start) return void (d.err = 'End time must be after the start time.');
    const c = conflict(d.date, d.resources, d.start, d.end, { ignore: p.id ? { kind: 'res', id: p.id } : null, ignoreBlocks: d.overBlocks });
    if (c) return void (d.err = c.kind === 'block' ? `That time is blocked (${c.label}). Tick "Book over blocked time" to book it anyway.` : `It overlaps the ${describe(c)}.`);
    const q = quote(d.date, d.resources, d.start, d.end), cust = { name: d.name.trim(), email: d.email.trim(), phone: d.phone.trim() };
    if (!p.id) {
      const ov = d.override === '' || d.override == null ? null : Number(d.override);
      const total = ov != null ? ov : r2(q.total * (1 - (Number(d.discount) || 0) / 100));
      const r = createReservation({ date: d.date, resources: d.resources, start: d.start, end: d.end, customer: cust, total, listTotal: q.total, lines: q.lines, method: d.method, note: d.note, by: 'owner' });
      if (d.notify && cust.email) notify(cust.email, `Booking confirmed: ${r.code}`, `${resLabel(r.resources)}, ${fmtD(r.date)}, ${fmtT(r.start)}–${fmtT(r.end)}. ${r.paid >= r.total ? 'Paid ' + money(r.paid) : 'Amount due ' + money(r.total)}.`);
      UI.flash = `Created ${r.code} for ${cust.name}.`; UI.oc.date = r.date; openItem('res', r.id, r.date);
    } else {
      const r = find('reservations', p.id); const before = `${fmtD(r.date)} ${fmtT(r.start)}–${fmtT(r.end)}, ${resLabel(r.resources)}`;
      Object.assign(r, { date: d.date, resources: sortRes(d.resources), start: d.start, end: d.end, customer: cust, note: d.note });
      let money_note = '';
      if (d.reprice) { const diff = r2(q.total - r.total); r.total = q.total; r.listTotal = q.total; r.lines = q.lines;
        if (diff > 0) { charge('adjustment', `${r.code} re-priced`, diff, 'card', { kind: 'res', id: r.id }); r.paid = r2(r.paid + diff); money_note = ` Charged ${money(diff)}.`; }
        if (diff < 0) { const amt = refundRef('res', r.id, -diff, 're-priced'); money_note = amt ? ` Refunded ${money(amt)}.` : ''; } }
      const after = `${fmtD(r.date)} ${fmtT(r.start)}–${fmtT(r.end)}, ${resLabel(r.resources)}`;
      if (d.notify && cust.email) notify(cust.email, `Your booking ${r.code} changed`, `Was: ${before}. Now: ${after}.${money_note}`);
      UI.flash = `Saved ${r.code}.${money_note}`; UI.oc.date = r.date; openItem('res', r.id, r.date);
    }
    save();
  },
  markPaid(a) { const r = find('reservations', a.dataset.id), bal = r2(r.total - r.paid); charge('rental', `${r.code} balance`, bal, 'cash', { kind: 'res', id: r.id }); r.paid = r.total; UI.flash = `Recorded ${money(bal)} for ${r.code}.`; save(); },
  cancelRes(a) { UI.panel = { type: 'cancel', id: a.dataset.id, draft: { refund: 'full', after: 'release', reason: '', notify: true } }; },
  doCancel() {
    const p = UI.panel, d = p.draft, r = find('reservations', p.id);
    const refund = d.refund === 'full' && r.paid > 0 ? refundRef('res', r.id, r.paid, 'cancelled') : 0;
    r.status = 'cancelled'; r.cancel = { at: nowISO(), refund, keep: d.after === 'keep', reason: d.reason.trim() };
    if (d.after === 'keep') S.blocks.push({ id: uid('b'), date: r.date, resources: r.resources, start: r.start, end: r.end, reason: `Held (cancelled ${r.code})` });
    if (d.notify && r.customer.email) notify(r.customer.email, `Booking ${r.code} cancelled`, `${resLabel(r.resources)}, ${fmtD(r.date)} ${fmtT(r.start)}–${fmtT(r.end)} is cancelled.${d.reason ? ' ' + d.reason.trim() + '.' : ''} ${refund ? 'Refund: ' + money(refund) + ' to your card.' : 'No refund.'}`);
    UI.flash = `Cancelled ${r.code}${refund ? `, refunded ${money(refund)}` : ''}. Time ${d.after === 'keep' ? 'kept blocked' : 'is open again'}.`; UI.panel = null; save();
  },
  goClass(a) { UI.otab = 'classes'; UI.oclass = a.dataset.id; UI.panel = null; },
  cancelSession(a) {
    const c = find('classes', a.dataset.id), date = UI.panel.date; c.skip = [...(c.skip || []), date];
    S.regs.filter(g => g.classId === c.id && g.status === 'active').forEach(g => notify(g.email, `${c.name}: ${fmtD(date)} cancelled`, `The ${fmtT(c.start)} session on ${fmtD(date, { weekday: 'long', month: 'long', day: 'numeric' })} is cancelled.`));
    UI.flash = `Cancelled the ${fmtD(date)} session of ${c.name}. The court is free that day.`; UI.panel = null; UI.confirm = null; save();
  },
  // reservations list
  rfilter(a) { UI.rf.filter = a.dataset.val; },
  // pricing
  ruleAdd(a) { const sp = a.dataset.val === 'special', t = TODAY(); S.rules.push({ id: uid('r'), name: sp ? 'Special date' : 'New rule', days: [0, 1, 2, 3, 4, 5, 6], start: 0, end: 1440, from: sp ? t : '', to: sp ? t : '', half: 40, full: 70, gym: 130 }); save(); },
  ruleDel(a) { S.rules.splice(+a.dataset.i, 1); UI.confirm = null; save(); },
  ruleMove(a) { const i = +a.dataset.i, j = i + +a.dataset.val; [S.rules[i], S.rules[j]] = [S.rules[j], S.rules[i]]; save(); },
  // classes
  newClass() { const t = TODAY(); UI.panel = { type: 'cls', id: null, draft: { name: '', desc: '', resources: ['C1N', 'C1S'], days: [1], start: 1080, end: 1140, startDate: t, weeks: 6, capacity: 12, price: 100, err: '', conflicts: 0, skipConf: false } }; },
  editClass(a) { const c = find('classes', a.dataset.id); UI.panel = { type: 'cls', id: c.id, draft: { ...JSON.parse(JSON.stringify(c)), err: '', conflicts: 0, skipConf: false } }; },
  saveClass() {
    const p = UI.panel, d = p.draft; d.err = '';
    if (!d.name.trim()) return void (d.err = 'Name the class.');
    if (!d.resources.length || !d.days.length) return void (d.err = 'Pick the court space and at least one day.');
    if (d.end <= d.start) return void (d.err = 'End time must be after the start time.');
    const tmp = { ...d, name: d.name.trim(), resources: sortRes(d.resources), weeks: Math.max(1, d.weeks | 0), capacity: Math.max(1, d.capacity | 0), skip: p.id ? (find('classes', p.id).skip || []) : [] };
    const bad = sessionsOf(tmp).filter(x => conflict(x, tmp.resources, tmp.start, tmp.end, { ignore: p.id ? { kind: 'class', id: p.id } : null }));
    if (bad.length && !d.skipConf) { d.conflicts = bad.length; return void (d.err = `${bad.length} session date(s) clash with existing bookings or blocks: ${bad.slice(0, 4).map(x => fmtD(x)).join(', ')}${bad.length > 4 ? '…' : ''}.`); }
    tmp.skip = [...tmp.skip, ...bad];
    const clean = { id: p.id || uid('c'), name: tmp.name, desc: d.desc, resources: tmp.resources, days: tmp.days, start: tmp.start, end: tmp.end, startDate: tmp.startDate, weeks: tmp.weeks, capacity: tmp.capacity, price: Number(tmp.price) || 0, status: 'active', skip: tmp.skip };
    if (p.id) Object.assign(find('classes', p.id), clean); else S.classes.push(clean);
    UI.flash = `${p.id ? 'Saved' : 'Created'} ${clean.name}: ${sessionsOf(clean).length} sessions now hold ${resLabel(clean.resources)} on the calendar.`; UI.panel = null; save();
  },
  roster(a) { UI.oclass = UI.oclass === a.dataset.id ? null : a.dataset.id; },
  removeReg(a) { const g = find('regs', a.dataset.id), c = find('classes', g.classId); g.status = 'removed';
    const amt = a.dataset.val === 'refund' ? refundRef('reg', g.id, g.paid || 0, 'removed from class') : 0;
    notify(g.email, `${c.name}: registration cancelled`, `${g.name} has been removed from ${c.name}. ${amt ? 'Refund ' + money(amt) + '.' : 'No refund.'}`); UI.confirm = null; save(); },
  cancelClass(a) { const c = find('classes', a.dataset.id), refund = a.dataset.val === 'refund'; c.status = 'cancelled'; let tot = 0;
    S.regs.filter(g => g.classId === c.id && g.status === 'active').forEach(g => { const amt = refund ? refundRef('reg', g.id, g.paid || 0, 'class cancelled') : 0; tot += amt; notify(g.email, `${c.name} cancelled`, `${c.name} has been cancelled. ${amt ? 'Refund ' + money(amt) + '.' : ''}`); });
    UI.flash = `Cancelled ${c.name}${tot ? ` and refunded ${money(tot)}` : ''}. Its court time is free again.`; UI.confirm = null; save(); },
  // memberships
  runBilling() { let n = 0, tot = 0; for (const m of S.members) if (m.status === 'active' && m.nextBill <= TODAY()) { charge('membership', `Open-gym membership: ${m.name}`, m.price, 'card', { kind: 'mem', id: m.id }); m.nextBill = addMonths(m.nextBill, 1); n++; tot += m.price; }
    UI.flash = `Billed ${n} member${n === 1 ? '' : 's'}, ${money(tot)}.`; save(); },
  billOne(a) { const m = find('members', a.dataset.id); charge('membership', `Open-gym membership: ${m.name}`, m.price, 'card', { kind: 'mem', id: m.id }); m.nextBill = addMonths(m.nextBill, 1); UI.flash = `Charged ${m.name} ${money(m.price)}.`; save(); },
  memCancel(a) { const m = find('members', a.dataset.id); m.status = 'cancelled'; m.cancelledAt = TODAY(); notify(m.email, 'Membership cancelled', `Your open-gym membership is cancelled. Access continues until ${fmtD(m.nextBill)}.`); UI.confirm = null; save(); },
  memReact(a) { const m = find('members', a.dataset.id), t = TODAY(); m.status = 'active';
    if (m.nextBill <= t) { charge('membership', `Open-gym membership: ${m.name}`, m.price, 'card', { kind: 'mem', id: m.id }); m.nextBill = addMonths(t, 1); } UI.flash = `${m.name} is active again.`; save(); },
  memAdd() { const f = UI.nm; f.err = ''; if (!f.name.trim()) return void (f.err = 'Enter a name.'); if (!validEmail(f.email)) return void (f.err = 'Enter a valid email.');
    const t = TODAY(), m = { id: uid('m'), name: f.name.trim(), email: f.email.trim(), start: t, price: S.membership, status: 'active', nextBill: addMonths(t, 1), cancelledAt: '' };
    S.members.push(m); charge('membership', `Open-gym membership: ${m.name}`, m.price, 'card', { kind: 'mem', id: m.id }); UI.nm = { name: '', email: '', err: '' }; UI.flash = `Added ${m.name}.`; save(); },
  // payments + settings
  refundTx(a) { const x = S.txns.find(t => t.id === a.dataset.id); const amt = refundTxn(x, x.amount, 'owner refund'); UI.flash = `Refunded ${money(amt)}.`; UI.confirm = null; save(); },
  hoursToggle(a) { const i = +a.dataset.i; S.hours[i] = S.hours[i] ? null : [360, 1380]; save(); },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} seed(); UI.panel = null; UI.confirm = null; UI.flash = 'Demo data reset.'; },
};
UI.nm = { name: '', email: '', err: '' };

app.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, f = ACT[act]; if (!f) return;
  if (act !== 'ask' && act !== 'unask' && !a.closest('.confirm-line')) UI.confirm = null;
  if (UI.view === 'owner' && !['unflash', 'ask', 'unask', 'togArr', 'setv', 'setArr', 'allDay'].includes(act)) UI.flash = '';
  f(a, e); render();
});
function readVal(el) {
  if (el.type === 'checkbox') return el.checked;
  if ('num' in el.dataset) return el.value === '' ? '' : Number(el.value);
  return el.value;
}
app.addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT') return; setPath(el.dataset.bind, readVal(el)); if (el.dataset.bind.startsWith('S.')) save(); });
app.addEventListener('change', e => {
  const el = e.target; if (!el.dataset || !el.dataset.bind) return;
  setPath(el.dataset.bind, readVal(el)); if (el.dataset.bind.startsWith('S.')) save();
  if (el.dataset.bind === 'UI.cs.date' || el.dataset.bind === 'UI.cs.dur') UI.cs.start = null;
  if (el.dataset.bind === 'UI.oc.date') { UI.panel = null; UI.oc.sel = null; }
  if ('rr' in el.dataset || el.type === 'checkbox' || el.tagName === 'SELECT') render();
});

load();
UI.cs.date = TODAY(); UI.oc.date = TODAY(); UI.og.date = TODAY();
try { if (location.hash === '#owner') UI.view = 'owner'; } catch (e) {}
render();
</script>
</body></html>
